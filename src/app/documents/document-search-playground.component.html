<button
  type="button"
  class="advanced-search-button"
  (click)="openAdvancedSearch()"
>
  Advanced search
</button>

<app-document-query-builder
  *ngIf="showAdvancedSearch"
  [fields]="advancedSearchFields"
  baseQuery="Deleted: 0"
  (closed)="closeAdvancedSearch()"
  (search)="runAdvancedSearch($event)"
></app-document-query-builder>

<div class="document-search-page">
  <div class="search-panel">
    <label for="documentSearch">Document Search</label>

    <div class="search-row">
      <input
        id="documentSearch"
        type="text"
        [formControl]="searchControl"
        placeholder="Search documents..."
        (keydown.enter)="runSearch()"
      />

      <button
        type="button"
        (click)="runSearch()"
        [disabled]="searching || !searchControl.value.trim()"
      >
        Search
      </button>

      <button
        type="button"
        class="collapse-btn"
        (click)="collapseAll()"
        [disabled]="searching || !showGrid"
      >
        Collapse All
      </button>

      <button
        type="button"
        (click)="toggleSplitView()"
        [disabled]="searching || !showGrid"
      >
        {{ isSplitView ? 'Close Split View' : 'Split View' }}
      </button>

      <label class="grouping-select">
        Grouping:
        <select [formControl]="groupingControl" (change)="onGroupingChange()">
          <option value="category">Category > Subcategory</option>
          <option value="section">Section > Category > Subcategory</option>
        </select>
      </label>
    </div>

    <!-- The overlay modal activated during the search process -->
    <div class="loading-modal-overlay" *ngIf="searching">
      <div class="loading-modal">
        <div class="spinner"></div>
        <h3>Searching...</h3>
        <p>Running search job and polling status every 3 seconds to determine category counts.</p>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>

  <div class="grid-container" *ngIf="showGrid" [class.split-view]="isSplitView">
    <ag-grid-angular
      class="ag-theme-alpine document-grid"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      (gridReady)="onLeftGridReady($event)"
      (rowGroupOpened)="onRowGroupOpened($event, true)">
    </ag-grid-angular>

    <ag-grid-angular
      *ngIf="isSplitView"
      class="ag-theme-alpine document-grid"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      (gridReady)="onRightGridReady($event)"
      (rowGroupOpened)="onRowGroupOpened($event, false)">
    </ag-grid-angular>
  </div>
</div>
