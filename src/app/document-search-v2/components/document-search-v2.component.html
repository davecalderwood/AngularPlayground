<div class="search-container">
  <h2>Document Search V2</h2>
  
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Documents</mat-label>
      <input matInput [(ngModel)]="searchText" (keyup.enter)="onSearch()" placeholder="Enter keyword or phrase...">
      <button mat-icon-button matSuffix (click)="onSearch()" [disabled]="searching">
         <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field appearance="outline" class="group-by-field">
      <mat-label>Group By</mat-label>
      <mat-select [(ngModel)]="groupBy" (selectionChange)="onGroupByChange()">
        <mat-option value="category">Category / Subcategory</mat-option>
        <mat-option value="section">Section / Category / Subcategory</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="searching" class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Searching...</span>
  </div>

  <div class="results-container" *ngIf="!searching && treeData.length > 0">
    <div class="tree-panel">
      <mat-tree [dataSource]="treeData" [childrenAccessor]="childrenAccessor" class="document-tree">
        
        <!-- Leaf node (Subcategory) -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding matTreeNodeToggle>
          <div class="node-content leaf-node-content" 
               [class.active-filter]="isNodeActive(node)"
               [class.highlighted-filter]="isNodeHighlighted(node)"
               (click)="onNodeClick(node)">
            <span class="node-name">{{node.name}}</span>
            <span class="node-count">({{node.count}})</span>
          </div>
        </mat-tree-node>
        
        <!-- Expandable node (All Docs, Category) -->
        <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
          <div class="mat-tree-node-group">
            <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
              <mat-icon class="mat-icon-rtl-mirror">
                chevron_right
              </mat-icon>
            </button>
            <div class="node-content" 
                 [class.active-filter]="isNodeActive(node)"
                 [class.highlighted-filter]="isNodeHighlighted(node)"
                 (click)="onNodeClick(node)">
                <span class="node-name">{{node.name}}</span>
                <span class="node-count">({{node.count}})</span>
            </div>
          </div>
        </mat-tree-node>

      </mat-tree>
    </div>
    
    <div class="content-panel">
        <div class="grid-controls">
            <span class="pagination-info">{{ paginationDisplay }}</span>
            <div class="buttons">
                <button mat-button (click)="prevPage()" [disabled]="currentPage === 0 || loadingGrid">Previous</button>
                <button mat-button (click)="nextPage()" [disabled]="(currentPage + 1) * pageSize >= totalFilteredDocs || loadingGrid">Next</button>
            </div>
        </div>
        
        <div class="grid-wrapper">
            <div *ngIf="loadingGrid" class="grid-overlay">
                <mat-spinner diameter="40"></mat-spinner>
                <span>Loading Page...</span>
            </div>
            <ag-grid-angular
                style="width: 100%; height: 100%;"
                class="ag-theme-alpine"
                [rowData]="rowData"
                [columnDefs]="columnDefs"
                (sortChanged)="onSortChanged($event)"
                [suppressPaginationPanel]="true">
            </ag-grid-angular>
        </div>
    </div>
  </div>
</div>
